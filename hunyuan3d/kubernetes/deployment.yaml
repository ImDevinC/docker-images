apiVersion: v1
kind: Namespace
metadata:
  name: hunyuan3d
  labels:
    name: hunyuan3d
    app: 3d-generation
---
# PersistentVolumeClaim for storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunyuan3d-models
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
# Secret for HuggingFace token (create manually or via kubectl)
# kubectl create secret generic hf-token --from-literal=token=YOUR_TOKEN -n hunyuan3d
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: hunyuan3d
type: Opaque
stringData:
  token: ""  # Set this or create via kubectl
---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: hunyuan3d-config
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
data:
  MODEL_PATH: "tencent/Hunyuan3D-2"
  SUBFOLDER: "hunyuan3d-dit-v2-0"
  TEXGEN_MODEL_PATH: "tencent/Hunyuan3D-2"
  LOW_VRAM_MODE: "false"
  ENABLE_FLASHVDM: "false"
  GRADIO_PORT: "7860"
  HOST: "0.0.0.0"
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunyuan3d
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
spec:
  replicas: 1
  strategy:
    type: Recreate  # Use Recreate for GPU workloads
  selector:
    matchLabels:
      app: hunyuan3d
  template:
    metadata:
      labels:
        app: hunyuan3d
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7860"
    spec:
      # Node selection for GPU nodes
      nodeSelector:
        nvidia.com/gpu.present: "true"
      
      # Tolerations for GPU nodes (if using taints)
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      
      # Service account (use default or create specific one)
      serviceAccountName: default
      
      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Init container to set up directories
      initContainers:
      - name: setup
        image: busybox:1.36
        command: ['sh', '-c', 'mkdir -p /cache/huggingface /cache/torch && chown -R 1000:1000 /cache']
        volumeMounts:
        - name: cache
          mountPath: /cache
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
      
      containers:
      - name: hunyuan3d
        image: hunyuan3d:latest  # Update with your registry/image
        imagePullPolicy: IfNotPresent
        
        # Command override if needed
        # args: ["gradio"]
        
        # Resource requests and limits
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: 1
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: hunyuan3d-config
        
        # Environment variables from Secret
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        
        # Ports
        ports:
        - containerPort: 7860
          name: gradio
          protocol: TCP
        
        # Volume mounts
        volumeMounts:
        - name: models
          mountPath: /models
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
        
        # Startup probe (for initial model download)
        startupProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 5 minutes max startup time
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: hunyuan3d-models
      - name: cache
        persistentVolumeClaim:
          claimName: hunyuan3d-cache
      - name: tmp
        emptyDir: {}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: hunyuan3d
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
spec:
  type: ClusterIP  # Change to LoadBalancer or NodePort as needed
  selector:
    app: hunyuan3d
  ports:
  - port: 80
    targetPort: 7860
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours for long-running sessions
---
# Optional: Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hunyuan3d
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
  annotations:
    # Adjust annotations based on your ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx  # Adjust based on your ingress controller
  rules:
  - host: hunyuan3d.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hunyuan3d
            port:
              number: 80
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - hunyuan3d.example.com
  #   secretName: hunyuan3d-tls
---
# Optional: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hunyuan3d-hpa
  namespace: hunyuan3d
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hunyuan3d
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
---
# Optional: PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hunyuan3d-pdb
  namespace: hunyuan3d
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hunyuan3d
---
# Optional: NetworkPolicy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hunyuan3d-netpol
  namespace: hunyuan3d
spec:
  podSelector:
    matchLabels:
      app: hunyuan3d
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 7860
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS for model downloads
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 80
