# Hunyuan3D-2 API Server Deployment
# This variant runs the API server instead of Gradio interface

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunyuan3d-api
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
    variant: api
spec:
  replicas: 2  # Can run multiple API server instances
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hunyuan3d
      variant: api
  template:
    metadata:
      labels:
        app: hunyuan3d
        variant: api
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: hunyuan3d-api
        image: hunyuan3d:latest
        imagePullPolicy: IfNotPresent
        
        # Override to run API server
        args: ["api"]
        
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: 1
        
        env:
        - name: MODEL_PATH
          value: "tencent/Hunyuan3D-2"
        - name: SUBFOLDER
          value: "hunyuan3d-dit-v2-0"
        - name: TEXGEN_MODEL_PATH
          value: "tencent/Hunyuan3D-2"
        - name: API_PORT
          value: "8080"
        - name: HOST
          value: "0.0.0.0"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        
        ports:
        - containerPort: 8080
          name: api
          protocol: TCP
        
        volumeMounts:
        - name: models
          mountPath: /models
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
        
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: hunyuan3d-models
      - name: cache
        persistentVolumeClaim:
          claimName: hunyuan3d-cache
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hunyuan3d-api
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
    variant: api
spec:
  type: ClusterIP
  selector:
    app: hunyuan3d
    variant: api
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: api
---
# API Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hunyuan3d-api
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
    variant: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/rate-limit: "10"
spec:
  ingressClassName: nginx
  rules:
  - host: api.hunyuan3d.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hunyuan3d-api
            port:
              number: 8080
