# StatefulSet deployment for Hunyuan3D-2
# Use when you need stable network identities and persistent storage per pod

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hunyuan3d
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
spec:
  serviceName: hunyuan3d-headless
  replicas: 2
  selector:
    matchLabels:
      app: hunyuan3d
  template:
    metadata:
      labels:
        app: hunyuan3d
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: hunyuan3d
        image: hunyuan3d:latest
        imagePullPolicy: IfNotPresent
        
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: 1
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: 1
        
        envFrom:
        - configMapRef:
            name: hunyuan3d-config
        
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        ports:
        - containerPort: 7860
          name: gradio
        
        volumeMounts:
        - name: models
          mountPath: /models
        - name: cache
          mountPath: /cache
        
        livenessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 120
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 60
          periodSeconds: 10
  
  # Persistent volume claim templates
  volumeClaimTemplates:
  - metadata:
      name: models
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 50Gi
  - metadata:
      name: cache
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi
---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: hunyuan3d-headless
  namespace: hunyuan3d
spec:
  clusterIP: None
  selector:
    app: hunyuan3d
  ports:
  - port: 7860
    name: gradio
